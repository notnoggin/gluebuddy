<!doctype html>
<html><head><meta charset="utf-8"><title>Gluebuddy</title>
<style>
  @font-face { font-family: Inter; src: url(fonts/inter.woff2) format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'JetBrains Mono'; src: url(fonts/jetbrains-mono.woff2) format('woff2'); font-weight: 100 800; }
  :root { --panel: #0c0c0c; --line: #202020; --tx: #f3f3f3; --mut: #858585; --or: #ff6a13; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; overflow: hidden; background: #000; color: var(--tx); font: 14px/1.5 Inter, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; }
  button:focus-visible, #box:focus-visible { outline: 2px solid var(--or); outline-offset: 2px; }

  #bar { flex: none; height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 16px; -webkit-app-region: drag; }
  #bar svg { width: 20px; height: 20px; }
  #bar b { font-size: 13px; font-weight: 600; letter-spacing: -.01em; }

  #hero { flex: none; padding: 14px 20px 0; }
  h1 { margin: 0; font-size: 38px; line-height: 1.05; font-weight: 700; letter-spacing: -.045em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sub { margin: 6px 0 0; color: var(--mut); }

  #chips { flex: none; display: flex; gap: 6px; padding: 16px 20px 0; overflow-x: auto; }
  #chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; background: none; color: var(--mut); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
  .chip:hover { color: var(--tx); border-color: #3a3a3a; }
  .chip.on { background: var(--tx); border-color: var(--tx); color: #000; font-weight: 600; }
  .chip i { font-style: normal; opacity: .55; margin-left: 5px; }

  #composer { flex: none; margin: 14px 20px 0; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; transition: border-color .15s; }
  #composer:focus-within { border-color: #444; }
  #box { display: block; width: 100%; height: 84px; resize: none; background: none; border: 0; outline: 0; color: var(--tx); padding: 12px 14px 4px; font: 14px/1.55 Inter, sans-serif; }
  #box::placeholder { color: #5a5a5a; }
  #composer .row { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 8px 14px; }
  .hint { color: var(--mut); font-size: 12px; }
  #save { background: #fff; color: #000; border: 0; border-radius: 999px; padding: 7px 16px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .15s; }
  #save:hover { background: var(--or); }

  #list { flex: 1; overflow-y: auto; margin-top: 10px; padding: 0 20px 20px; }
  ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: #1d1d1d; border-radius: 4px; }
  .it { padding: 14px 0; border-top: 1px solid var(--line); }
  .it:first-child { border-top: 0; }
  .txt { margin: 0; white-space: pre-wrap; word-break: break-word; font: 14px/1.55 Inter, sans-serif; }
  .txt.mono { font: 12.5px/1.6 'JetBrains Mono', Consolas, monospace; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .txt.link { color: var(--or); }
  .txt.clamp { max-height: 11em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 65%, transparent); }
  .it img { display: block; max-width: 100%; max-height: 240px; border-radius: 8px; cursor: zoom-in; }
  .file b { display: block; font-weight: 600; }
  .file span { color: var(--mut); font-size: 12px; word-break: break-all; }
  .acts { display: flex; align-items: center; gap: 16px; margin-top: 10px; opacity: 0; transition: opacity .12s; }
  .it:hover .acts, .it:focus-within .acts { opacity: 1; }
  .acts button { background: none; border: 0; padding: 0; color: var(--mut); font-size: 12px; cursor: pointer; }
  .acts button:hover { color: var(--tx); }
  .tag { margin-left: auto; color: var(--mut); font-size: 12px; }

  #empty { padding-top: 26px; }
  #empty svg { width: 88px; height: 88px; margin-bottom: 14px; }
  #empty h2 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -.03em; }
  #empty p { margin: 0; color: var(--mut); max-width: 34ch; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style></head>
<body>
  <div id="bar"></div>
  <div id="hero"><h1 id="app"></h1><p id="sub"></p></div>
  <div id="chips"></div>
  <div id="composer">
    <textarea id="box" placeholder="Type or paste text, code or a link"></textarea>
    <div class="row"><span class="hint">Enter saves. Shift+Enter adds a line.</span><button id="save"></button></div>
  </div>
  <div id="list"></div>
  <script src="renderer.js"></script>
</body></html>
